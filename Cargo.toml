[workspace]
resolver = "3"
members = ["crates/monerod-rpc", "crates/explorer-core", "crates/explorer-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xmrack/oxblocks"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the client read an answer straight into its type, keeping
# the JSON-RPC envelope's `result` as unparsed text on the way.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
# The premise of this project. See README.md.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A panic in a handler costs a response, not the process -- but a panic
# reachable from untrusted input is still a bug.
#
# Denied rather than warned, so a local build fails the same way CI does. These
# were "warn" while CI ran with -D warnings, which made the rule real only on
# the machine nobody develops on. Test modules opt out individually, because
# panicking is the correct failure mode in a test.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# Chain data is u64 throughout and every lossy narrowing should be a decision
# with a comment, not an accident. Warn rather than deny: two casts here are
# deliberate and carry `#[allow]` with a reason.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[profile.release]
# Explorer arithmetic is all chain-derived u64s (amounts, offsets, heights).
# A silent wrap here is a wrong number on a page, so pay for the checks.
overflow-checks = true

# monero-oxide's curve arithmetic is slow unoptimised: the tests hash real
# curve-tree paths and decode the FCMP++ generators, which takes over a minute
# in a plain debug build and a few seconds optimised. monerod builds its own
# copy of these crates the same way (`src/fcmp_pp/fcmp_pp_rust/Cargo.toml`).
[profile.dev.package]
subtle = { opt-level = 3 }
curve25519-dalek = { opt-level = 3 }
ff = { opt-level = 3 }
group = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
dalek-ff-group = { opt-level = 3 }
helioselene = { opt-level = 3 }
multiexp = { opt-level = 3 }
ec-divisors = { opt-level = 3 }
generalized-bulletproofs = { opt-level = 3 }
full-chain-membership-proofs = { opt-level = 3 }
monero-fcmp-plus-plus = { opt-level = 3 }
monero-fcmp-plus-plus-generators = { opt-level = 3 }
monero-ed25519 = { opt-level = 3 }
