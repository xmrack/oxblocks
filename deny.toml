# cargo-deny configuration.
#
# The project's claim is a small, checkable dependency tree. That claim decays
# silently unless something enforces it, so these checks run in CI.

[advisories]
# Any advisory against anything we ship is a build failure. An explorer is
# public-facing; there is no "we will get to it" tier.
yanked = "deny"
# An unmaintained crate has no one to report a vulnerability to. This caught
# `hex`, last released in 2021 and since replaced by explorer-core::hex.
unmaintained = "all"

[bans]
# Two versions of the same crate means two copies of its bugs, and it is
# usually an unnoticed transitive upgrade rather than a decision.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # TLS is rustls-only; the C library and its bindings are not in the tree
    # and a transitive dependency must not quietly put them there.
    { crate = "openssl", reason = "rustls is the only TLS stack here" },
    { crate = "openssl-sys", reason = "rustls is the only TLS stack here" },
    { crate = "native-tls", reason = "rustls is the only TLS stack here" },
    # Replaced by explorer-core::hex; unmaintained since 2021.
    { crate = "hex", reason = "replaced by explorer-core::hex" },
]

[licenses]
# Permissive licences only. The project is MIT; a copyleft dependency would
# change what downstream users may do with it, which is not a decision to make
# by accident during a `cargo add`.
# Exactly what the current tree contains, and nothing speculative: a new
# licence should require someone to look at the dependency that brought it in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # foldhash, hashbrown's default hasher, under monero-oxide's std-shims.
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# monero-oxide's crates come from git, pinned by revision to the one monerod's
# stressnet v3 branch builds with.
allow-git = ["https://github.com/monero-oxide/monero-oxide"]
