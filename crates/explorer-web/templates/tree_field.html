{# The curve tree `t`, a `TreeField`, drawn. The page draws it wide and narrow,
   and the stylesheet shows one; the narrow one reuses the wide one's strokes. #}
<svg class="tf-fig tf-{{ t.class }}" viewBox="0 0 {{ t.width }} {{ t.height }}" role="img" aria-label="{{ t.aria }}">
<defs><radialGradient id="tf-bloom-{{ t.class }}"><stop offset="0" class="tf-b0"/><stop offset=".35" class="tf-b1"/><stop offset="1" class="tf-b2"/></radialGradient></defs>
{% if let Some(m) = t.reuse %}<use href="#tf-art" transform="{{ m }}"/>{% else %}<g id="tf-art">{% for s in t.art %}
<path class="{{ s.class }}" d="{{ s.d }}"/>{% endfor %}
</g>{% endif %}
{% for s in t.nodes %}<path class="{{ s.class }}" d="{{ s.d }}"/>
{% endfor %}<circle class="tf-bloom" cx="{{ t.root.x }}" cy="{{ t.root.y }}" r="{{ t.root.bloom }}" fill="url(#tf-bloom-{{ t.class }})"/><circle class="tf-ring tf-{{ t.root.curve }}" cx="{{ t.root.x }}" cy="{{ t.root.y }}" r="{{ t.root.ring }}"/><circle class="tf-core" cx="{{ t.root.x }}" cy="{{ t.root.y }}" r="{{ t.root.core }}"/>
<path class="tf-axis" d="{{ t.axis }}"/>{% for d in t.leads %}<path class="tf-lead" d="{{ d }}"/>{% endfor %}<path class="tf-tick" d="{{ t.ticks }}"/>
{% for l in t.labels %}{% if let Some(d) = l.comb %}<path class="tf-key tf-ko" d="{{ d }}"/>{% else %}<circle class="tf-key tf-k{{ l.key }}" cx="{{ l.key_x }}" cy="{{ l.key_y }}" r="{{ l.key_r }}"/>{% endif %}<text class="tf-name{% if t.class == "narrow" %} tf-sm{% endif %}" x="{{ l.x }}" y="{{ l.y }}">{{ l.name }}{% if let Some(a) = l.aside %}<tspan class="tf-cv"> · {{ a }}</tspan>{% endif %}</text>{% for ln in l.lines %}<text class="tf-{{ ln.class }}{% if t.class == "narrow" %} tf-sm{% endif %}" x="{{ l.x }}" y="{{ ln.y }}">{% if ln.faint %}<tspan class="tf-pp">{{ ln.text }}</tspan>{% else %}{{ ln.text }}{% endif %}{% if let Some(b) = ln.block %}<a href="/block/{{ b }}"><tspan class="tf-lnk">{{ b }}</tspan></a>{% endif %}</text>{% endfor %}
{% endfor %}<path class="tf-brk" d="{{ t.brackets }}"/>{% for m in t.measures %}<text class="tf-meas" x="{{ m.x }}" y="{{ m.y }}" text-anchor="{{ m.anchor }}">{{ m.before }}{% if let Some(s) = m.short %}<tspan class="tf-short">{{ s }}</tspan>{% endif %}{{ m.after }}</text>{% endfor %}
</svg>
