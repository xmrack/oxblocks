name: CI

on:
  push:
  pull_request:

# Read the code, nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A broken intra-doc link is a broken claim: the docs here carry the
      # reasoning, and a link that no longer resolves usually means the thing
      # it named has been renamed or removed.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # No daemon and no network: every test that needs one is #[ignore]d, and
      # the fixtures under fixtures/ are checked in precisely so this holds.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

  # rust-version in Cargo.toml and the Dockerfile's base image both claim 1.88.
  # An unchecked minimum drifts upward silently the first time a dependency or
  # a language feature needs more, and the Dockerfile stops building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build at the declared minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  # The memory-safety claim is compiler-enforced, but only if nothing quietly
  # relaxes it. This fails if `forbid(unsafe_code)` is dropped from any crate.
  unsafe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Every crate must forbid unsafe
        run: ./tools/check-unsafe.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  # A tree nobody counts is a tree that only grows. Fails when a crate enters
  # or leaves without deps-baseline.txt being updated in the same commit.
  dependency-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Dependency tree matches the committed baseline
        run: ./tools/check-deps.sh
